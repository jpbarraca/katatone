# ALSA configuration inside the Flatpak sandbox: the runtime's own, with one change.
#
# The runtime sets defaults.pcm.ipc_gid to the group *name* "audio", which the sandbox does
# not have, so every device that shares a card through dsnoop or dmix failed with "The field
# ipc_gid must be a valid group (create group audio)": that includes
# "sysdefault:CARD=KATANA3", the input the Tuner and the Analyzer preselect.  ALSA accepts a
# group id here; it only labels the shared-memory segment, so any id will do.  It has to be a
# quoted string, like the setting it replaces (an integer is refused as a type mismatch).
</usr/share/alsa/alsa-flatpak.conf>
defaults.pcm.ipc_gid "0"
