[project]
name = "katatone"
version = "0.1.0"
description = "Linux patch editor for the Katana 50 Gen 3 amplifier (RC6 MIDI)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["flet>=1.0", "numpy>=1.26"]
dev = ["pytest>=8", "platformdirs"]

[project.scripts]
katatone = "katatone.cli:main"
katatone-gui = "katatone.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["katatone*"]

[tool.setuptools.package-data]
katatone = ["assets/address_map.json"]
