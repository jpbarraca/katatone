[project]
name = "katatone"
version = "0.4.1"
description = "Linux patch editor for the Katana 50 Gen 3 amplifier (RC6 MIDI)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The GUI itself; add `desktop` (a window), `web` (a browser, e.g. a headless
# Raspberry Pi) or both, so each machine installs only what it uses.
gui = ["flet>=1.0", "numpy>=1.26"]
desktop = ["katatone[gui]", "flet-desktop>=1.0"]
web = ["katatone[gui]", "flet-web>=1.0"]
# The amp over Bluetooth (BlueZ through D-Bus).
bluetooth = ["dbus-fast>=2.0"]
dev = ["pytest>=8", "platformdirs"]

[project.scripts]
katatone = "katatone.cli:main"
katatone-gui = "katatone.gui.app:main"
katatone-web = "katatone.gui.app:main_web"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["katatone*"]

[tool.setuptools.package-data]
katatone = ["assets/address_map.json", "gui/param_labels.json"]
